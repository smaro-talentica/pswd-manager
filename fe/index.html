<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA theme + iOS install support -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="password-manager" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <title>Password Manager</title>
    <script>
      window.__PM_DEFERRED_INSTALL__ = null
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__PM_DEFERRED_INSTALL__ = event
        window.dispatchEvent(new Event('pm-installprompt'))
      })
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pm-appearance')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
