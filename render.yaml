# Neon (Postgres) + Render — apply from Dashboard: New → Blueprint → this repo.
# See README "Deploy (free tier)" for env vars and deploy order.

services:
  - type: web
    name: pswd-manager-api
    runtime: node
    plan: free
    region: oregon
    rootDir: be
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: pswd-manager-fe
    runtime: static
    plan: free
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_ENV
        value: production
      - key: VITE_API_BASE_URL
        sync: false
